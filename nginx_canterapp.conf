# Configuración aislada de Nginx para CanterApp.nexusstudiocode.online (Servidor compartido)
server {
    listen 80;
    server_name CanterApp.nexusstudiocode.online www.CanterApp.nexusstudiocode.online;

    # Frontend React (Vite Build estático)
    location / {
        root /var/www/canterapp/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Archivos estáticos y media de Django
    location /static/ {
        alias /var/www/canterapp/backend/staticfiles/;
    }

    location /media/ {
        alias /var/www/canterapp/backend/media/;
    }

    # Proxy inverso a Gunicorn (Puerto libre 8005)
    location /api/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
